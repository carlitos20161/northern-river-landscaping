<div style="font-family: system-ui, sans-serif, Arial; font-size: 12px">
  <div>A message by <strong>{{fullName}}</strong> has been received. Kindly respond at your earliest convenience.</div>
  <div
    style="
      margin-top: 20px;
      padding: 15px 0;
      border-width: 1px 0;
      border-style: dashed;
      border-color: lightgrey;
    "
  >
    <table role="presentation">
      <tr>
        <td style="vertical-align: top">
          <div
            style="
              padding: 6px 10px;
              margin: 0 10px;
              background-color: aliceblue;
              border-radius: 5px;
              font-size: 26px;
            "
            role="img"
          >
            👤
          </div>
        </td>
        <td style="vertical-align: top">
          <div style="color: #2c3e50; font-size: 16px">
            <strong>{{fullName}}</strong>
          </div>
          <div style="color: #666; font-size: 14px; margin-top: 4px">
            📧 {{email}} &nbsp;|&nbsp; 📞 {{phone}}
          </div>
          <div style="color: #888; font-size: 13px; margin-top: 8px">
            Service: {{serviceType}}{{otherServiceType}} &nbsp;|&nbsp; Contact by: {{contactMethod}} &nbsp;|&nbsp; Best time: {{contactTime}}
          </div>
          <p style="font-size: 16px; margin-top: 12px">{{projectDetails}}</p>
        </td>
      </tr>
    </table>
  </div>
</div>
